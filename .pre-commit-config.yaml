minimum_pre_commit_version: '3.2.0'
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: black
        name: Black formatting check
        entry: python -m black --check .
        language: python
        additional_dependencies: ['black>=24.0']
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: pylint
        name: Pylint
        entry: python -m pylint
        language: python
        additional_dependencies: ['pylint>=3.0']
        types: [python]
        require_serial: true
        stages: [pre-commit]

      - id: pytest
        name: Regression tests
        entry: python -m pytest
        language: python
        additional_dependencies: ['pytest>=8.0', 'pytest-cov>=5.0']
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: mypy
        name: Mypy
        entry: python -m mypy .
        language: python
        additional_dependencies: ['mypy>=1.10']
        pass_filenames: false
        always_run: true
        stages: [pre-push]
